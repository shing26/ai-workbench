<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Workbench</title>
    <script>
      (() => {
        try {
          const themes = ["dark", "light", "system"];
          const accents = ["emerald", "ocean", "iris", "amber", "sakura"];
          let theme = localStorage.getItem("ai-workbench:theme") || "dark";
          if (!themes.includes(theme)) theme = "dark";
          let accent = localStorage.getItem("ai-workbench:accent") || "emerald";
          if (!accents.includes(accent)) accent = "emerald";
          const resolved = theme === "system"
            ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
            : theme;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeResolved = resolved;
          document.documentElement.dataset.accent = accent;
          document.documentElement.style.colorScheme = resolved;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
